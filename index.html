<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ghosie 导航页，keep silent 官方网站，提供博客、记账系统、zTree 文档、SG-UI 组件库、流量卡办理、工具箱等常用服务入口。"
    />
    <meta name="keywords" content="导航页, Ghosie, 博客, 记账系统, zTree, SG-UI, 流量卡办理, 开发者工具" />
    <meta property="og:title" content="Ghosie 导航页" />
    <meta property="og:description" content="keep silent 官方网站，现代化响应式导航页面，连接技术与创意的桥梁" />
    <meta property="og:url" content="https://keep-silent.com" />
    <title>Ghosie 导航</title>
    <style>
      :root {
        --primary: #00f3ff;
        --secondary: #ff00c8;
        --accent: #00ff9d;
        --bg-dark: #0a0a0a;
        --card-bg: rgba(15, 15, 15, 0.8);
        --text-main: #ffffff;
        --text-sub: #cccccc;
        --glow: 0 0 15px;
        --transition: 0.4s;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg-dark);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* 粒子背景 */
      #particles-js,
      #fallback-particles {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: -1;
      }

      /* 主容器 */
      .container {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 2rem;
      }

      /* 标题区域 */
      .header {
        text-align: center;
        margin: 2rem 0 3rem;
        animation: fadeSlide 1s ease-out;
      }

      .header h1 {
        font-size: 3.5rem;
        background: linear-gradient(45deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: var(--glow) var(--primary);
        letter-spacing: 2px;
      }

      /* 导航网格 */
      .nav-grid {
        display: grid;
        gap: 2rem;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1rem;
        width: 100%;
      }

      /* 卡片样式 */
      .nav-card {
        background: var(--card-bg);
        border: 1px solid rgba(0, 243, 255, 0.3);
        border-radius: 16px;
        padding: 2rem;
        text-decoration: none;
        color: var(--text-main);
        transition: all var(--transition) cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: fadeUp 0.8s ease-out;
        animation-fill-mode: backwards;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 200px;
      }

      /* 卡片动画延迟 */
      .nav-card:nth-child(1) {
        animation-delay: 0.1s;
      }
      .nav-card:nth-child(2) {
        animation-delay: 0.2s;
      }
      .nav-card:nth-child(3) {
        animation-delay: 0.3s;
      }
      .nav-card:nth-child(4) {
        animation-delay: 0.4s;
      }
      .nav-card:nth-child(5) {
        animation-delay: 0.5s;
      }
      .nav-card:nth-child(6) {
        animation-delay: 0.6s;
      }
      .nav-card:nth-child(7) {
        animation-delay: 0.7s;
      }

      /* 卡片悬停效果 */
      .nav-card:hover {
        transform: translateY(-10px) scale(1.03);
        border-color: var(--primary);
        box-shadow: 0 20px 40px rgba(0, 243, 255, 0.4);
        background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(15, 15, 15, 0.9));
      }

      /* 卡片内容 */
      .card-icon {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        transition: all 0.3s ease;
      }

      .nav-card:hover .card-icon {
        transform: scale(1.2) rotate(5deg);
        text-shadow: var(--glow) var(--primary);
      }

      .card-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        background: linear-gradient(45deg, var(--accent), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .card-desc {
        color: var(--text-sub);
        font-size: 0.9rem;
        line-height: 1.5;
        max-width: 250px;
      }

      /* 发光边框 */
      .nav-card::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
        border-radius: 18px;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s ease;
        animation: glowRotate 3s linear infinite;
      }

      .nav-card:hover::before {
        opacity: 1;
      }

      /* 动画定义 */
      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes glowRotate {
        0%,
        100% {
          filter: hue-rotate(0deg);
        }
        50% {
          filter: hue-rotate(180deg);
        }
      }

      /* 响应式设计 */
      @media (min-width: 1400px) {
        .nav-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .container {
          padding: 3rem;
        }
      }

      @media (min-width: 1024px) and (max-width: 1399px) {
        .nav-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (min-width: 768px) and (max-width: 1023px) {
        .nav-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .container {
          padding: 1.5rem;
        }
        .header h1 {
          font-size: 2.8rem;
        }
      }

      @media (max-width: 767px) {
        .nav-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }
        .container {
          padding: 1rem;
        }
        .header {
          margin: 1rem 0 2rem;
        }
        .header h1 {
          font-size: 2rem;
          letter-spacing: 1px;
        }
        .nav-card {
          padding: 1.5rem;
          min-height: 160px;
        }
        .card-icon {
          font-size: 2.5rem;
          margin-bottom: 1rem;
        }
        .card-title {
          font-size: 1.3rem;
        }
        .card-desc {
          font-size: 0.85rem;
          max-width: 100%;
        }
      }

      /* 加载动画 */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-dark);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }

      .loader {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(0, 243, 255, 0.3);
        border-radius: 50%;
        border-top-color: var(--primary);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 备用粒子动画 */
      .fallback-particles {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        background: var(--primary);
        border-radius: 50%;
        opacity: 0.6;
        animation: float linear infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(-100px) translateX(20px);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- 加载动画 -->
    <div class="loading" id="loading">
      <div class="loader"></div>
    </div>

    <!-- 粒子背景 -->
    <div id="particles-js"></div>
    <div class="fallback-particles" id="fallback-particles"></div>

    <div class="container">
      <!-- 简洁标题 -->
      <header class="header">
        <h1>GHOSIE 导航</h1>
      </header>

      <!-- 导航网格 -->
      <main class="nav-grid">
        <a href="https://blog.keep-silent.com" target="_blank" class="nav-card" title="访问博客">
          <div class="card-icon">📝</div>
          <h2 class="card-title">博客</h2>
          <p class="card-desc">分享编程心得与技术文章</p>
        </a>

        <a href="#" class="nav-card account-link" title="访问记账系统">

        <a
          href="https://docs.caacle.com/zTree_v3/api/API_cn.html"

        </a>

        <a href="https://sg-ui.keep-silent.com" target="_blank" class="nav-card" title="访问 SG-UI 组件库">
          <div class="card-icon">🎨</div>

        </a>

        <a
          href="https://h5.haokavip.com/#/pages/sales_index/index?agent_id=572765"
          target="_blank"
          class="nav-card"
          title="办理流量卡1"
        >
          <div class="card-icon">📱</div>

          <p class="card-desc">超值流量套餐优惠办理</p>
        </a>

        <a
          href="https://h5.lot-ml.com/ProductEn/Index/19b8a10403e4d369"

          class="nav-card"
          title="流量卡办理2"
        >
          <div class="card-icon">📶</div>
          <h2 class="card-title">流量卡办理2</h2>

        <a href="https://tools.keep-silent.com" target="_blank" class="nav-card" title="访问工具箱">
          <div class="card-icon">🔧</div>

        <a href="https://win11.keep-silent.com" target="_blank" class="nav-card" title="使用vue仿win11">

    <!-- Particles.js 库 -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <script>
      // 全局状态管理
      let isActive = false;
      let currentType = null;
      let resizeTimer = null;

      // 页面加载完成
      window.addEventListener("load", () => {
        setTimeout(() => {
          document.getElementById("loading").style.opacity = "0";
          setTimeout(() => {
            document.getElementById("loading").remove();
          }, 500);
        }, 800);
      });

      // 粒子系统管理
      function destroySystem() {
        try {
          if (window.pJSDom?.[0]?.pJS) {
            window.pJSDom[0].pJS.fn.vendors.destroypJS();
            window.pJSDom = [];
          }
        } catch (e) {
          console.warn("Destroy error:", e);
        }

        const fallback = document.getElementById("fallback-particles");
        if (fallback) fallback.innerHTML = "";

        isActive = false;
        currentType = null;
      }

      function initSystem() {
        destroySystem();

        if (typeof particlesJS !== "undefined") {
          initParticles();
          currentType = "particlesjs";
        } else {
          initFallback();
          currentType = "fallback";
        }
        isActive = true;
      }

      function initParticles() {
        try {
          const mobile = window.innerWidth <= 768;
          particlesJS("particles-js", {
            particles: {
              number: { value: mobile ? 40 : 80, density: { enable: true, value_area: mobile ? 600 : 800 } },
              color: { value: "#00f3ff" },
              shape: { type: "circle" },
              opacity: { value: 0.5, random: true },
              size: { value: mobile ? 2 : 3, random: true },
              line_linked: {
                enable: true,
                distance: mobile ? 100 : 150,
                color: "#00f3ff",
                opacity: mobile ? 0.2 : 0.3,
                width: 1,
              },
              move: {
                enable: true,
                speed: mobile ? 1 : 2,
                direction: "none",
                random: true,
                straight: false,
                out_mode: "out",
                bounce: false,
              },
            },
            interactivity: {
              detect_on: "canvas",
              events: {
                onhover: { enable: true, mode: "repulse" },
                onclick: { enable: true, mode: "push" },
                resize: false,
              },
              modes: {
                repulse: { distance: mobile ? 80 : 100, duration: 0.4 },
                push: { particles_nb: mobile ? 2 : 4 },
              },
            },
            retina_detect: true,
          });
        } catch (e) {
          console.error("Particles init error:", e);
          initFallback();
          currentType = "fallback";
        }
      }

      function initFallback() {
        const container = document.getElementById("fallback-particles");
        if (!container) return;

        container.innerHTML = "";
        const count = window.innerWidth <= 768 ? 20 : 40;

        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "particle";
          const size = Math.random() * 4 + 1;
          el.style.cssText = `
            width: ${size}px;
            height: ${size}px;
            left: ${Math.random() * 100}%;
            animation-duration: ${Math.random() * 10 + 10}s;
            animation-delay: ${Math.random() * 5}s;
            opacity: ${Math.random() * 0.5 + 0.2};
          `;
          container.appendChild(el);
        }
      }

      // 防抖resize处理
      function handleResize() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          console.log("Resizing particle system...");
          initSystem();
        }, 300);
      }

      // 初始化
      document.addEventListener("DOMContentLoaded", () => setTimeout(initSystem, 100));
      window.addEventListener("resize", handleResize);

      // 链接处理
      function updateLinks() {
        const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
        const link = document.querySelector(".account-link");
        if (link) link.href = isMobile ? "https://m.keep-silent.com" : "https://admin.keep-silent.com";
      }
      updateLinks();

      // 交互效果
      document.querySelectorAll(".nav-card").forEach((card) => {
        card.addEventListener("click", function (e) {
          e.preventDefault();
          const ripple = document.createElement("span");
          const rect = this.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          const x = e.clientX - rect.left - size / 2;
          const y = e.clientY - rect.top - size / 2;

          ripple.style.cssText = `
            position: absolute;
            width: ${size}px;
            height: ${size}px;
            left: ${x}px;
            top: ${y}px;
            background: radial-gradient(circle, rgba(0,243,255,0.6) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
            z-index: 10;
          `;

          this.appendChild(ripple);
          setTimeout(() => {
            ripple.remove();
            window.open(this.href, this.target || "_self");
          }, 300);
        });
      });

      // 添加涟漪动画
      document.head.insertAdjacentHTML(
        "beforeend",
        `
        <style>
          @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
          }
          @media (max-width: 767px) { body { font-size: 16px; } }
        </style>
      `,
      );

      // 错误恢复
      window.addEventListener("error", (e) => {
        if (e.error?.message?.includes("particles")) {
          console.log("Recovering particle system...");
          setTimeout(() => !isActive && initSystem(), 1000);
        }
      });
    </script>
  </body>
</html>
