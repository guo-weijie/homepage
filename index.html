<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghosie 导航</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 14px;
    }

    body {
      width: 100%;
      height: 100vh;
    }

    .box {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 20px;
    }

    .box a {
      display: inline-block;
      border-radius: 10px;
      text-decoration: none;
      position: relative;
    }

    .box a::after {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      line-height: 1;
      font-size: 1.5em;
    }

    .box a:hover {
      background-color: #f5f5f5;
      transform: scale(1.1);
      transition: all 0.3s;
      cursor: pointer;
      font-weight: bold;
      color: #fff !important;
      opacity: 0.8 !important;
    }

    a.blog::after {
      content: '博客';
    }

    a.account::after {
      content: '记账';
    }

    a.ztree::after {
      content: 'ztree';
    }

    a.sgui::after {
      content: 'SG-UI';
    }

    a.simcard1::after {
      content: '流量卡办理1';
    }

    a.simcard2::after {
      content: '流量卡办理2';
    }

    @media screen and (min-width: 768px) {
      .box {
        flex-wrap: wrap;
      }

      .box a {
        width: 20%;
        padding-top: 20%;
      }
    }

    @media screen and (max-width: 768px) {
      .box {
        flex-wrap: wrap;
      }

      .box a {
        width: 40%;
        padding-top: 40%;
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <a href="https://blog.keep-silent.com" class="blog"></a>
    <a href="https://admin.keep-silent.com" class="account"></a>
    <a href="https://docs.caacle.com/zTree_v3/api/API_cn.html" class="ztree"></a>
    <a href="https://sg-ui.keep-silent.com" class="sgui"></a>
    <a href="https://h5.haokavip.com/#/pages/sales_index/index?agent_id=572765" class="simcard1"></a>
    <a href="https://h5.lot-ml.com/ProductEn/Index/19b8a10403e4d369" class="simcard2"></a>
  </div>

  <!-- <script src="./js/color-thief.umd.js"></script> -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

  <script>
    /**
     * getColor() 获取主色
     * getPalette() 获取调色板
     */
    const colorThief = new ColorThief();
    const img = new Image();
    // 设置该属性表明必须使用 CORS 完成相关图像的抓取。启用 CORS 的图像可以在 <canvas> 元素中重复使用，而不会被标记为“污染（tainted）”。
    img.crossOrigin = 'anonymous';
    img.src = 'https://bing.biturl.top/?resolution=1920&format=image&mkt=zh-CN';
    img.onload = function () {
      const box = document.querySelector('.box')
      box.style.backgroundImage = `url(${img.src})`
      const colors = colorThief.getColor(img);
      const cards = box.querySelectorAll('a')
      const bgColor = `rgb(${colors[0]}, ${colors[1]}, ${colors[2]})`
      const fontColor = `rgb(${colors[0] + 200}, ${colors[1] + 200}, ${colors[2] + 200})`
      cards.forEach(card => {
        // 设置背景色和磨砂玻璃效果
        card.style.backgroundColor = bgColor
        card.style.opacity = 0.5
        // 字体颜色动态生成高对比度颜色
        card.style.color = fontColor
      })
    }

    /**
     * 判断用户是PC端还是移动端
     */
    function isMobile() {
      var userAgentInfo = navigator.userAgent;
      var Agents = ["Android", "iPhone", "iPad"];
      return Agents.some(item => userAgentInfo.indexOf(item) > 0)
    }
    const account = document.querySelector('.account');
    if (isMobile()) {
      account.href = 'https://m.keep-silent.com'
    } else {
      account.href = 'https://admin.keep-silent.com'
    }
  </script>
</body>

</html>
