    <style>
      :root {
        --primary: #00f3ff;
        --secondary: #ff00c8;
        --accent: #00ff9d;
        --bg-dark: #0a0a0a;
        --card-bg: rgba(15, 15, 15, 0.8);
        --text-main: #ffffff;
        --text-sub: #cccccc;
        --glow: 0 0 15px;
        --transition-duration: 0.4s;
      }

      html {
        scroll-behavior: smooth;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      ::selection {
        background: rgba(0, 243, 255, 0.3);
        color: #fff;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg-dark);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }

      /* 粒子背景 */
      #particles-js,
      #fallback-particles {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: -1;
      }

      /* 主容器 */
      .container {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 2rem;
      }

      /* 标题区域 */
      .header {
        text-align: center;
        margin: 2rem 0 3rem;
        animation: fadeSlide 1s ease-out;
      }

      .header h1 {
        font-size: 3.5rem;
        background: linear-gradient(45deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 15px var(--primary));
        letter-spacing: 2px;
      }

      /* 导航网格 */
      .nav-grid {
        display: grid;
        gap: 2rem;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1rem;
        width: 100%;
      }

      /* 卡片样式 */
      .nav-card {
        background: var(--card-bg);
        border: 1px solid rgba(0, 243, 255, 0.3);
        border-radius: 16px;
        padding: 2rem;
        text-decoration: none;
        color: var(--text-main);
        transition:
          transform var(--transition-duration) cubic-bezier(0.175, 0.885, 0.32, 1.275),
          border-color var(--transition-duration),
          box-shadow var(--transition-duration),
          background var(--transition-duration);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: fadeUp 0.8s ease-out backwards;
        animation-delay: calc(var(--i, 0) * 0.1s);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 200px;
        will-change: transform;
        touch-action: manipulation;
      }

      /* 卡片悬停效果 */
      .nav-card:hover {
        transform: translateY(-10px) scale(1.03);
        border-color: var(--primary);
        box-shadow: 0 20px 40px rgba(0, 243, 255, 0.4);
        background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(15, 15, 15, 0.9));
      }

      /* 卡片内容 */
      .card-icon {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        transition:
          transform 0.3s ease,
          text-shadow 0.3s ease;
      }

      .nav-card:hover .card-icon {
        transform: scale(1.2) rotate(5deg);
        text-shadow: var(--glow) var(--primary);
      }

      .card-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--accent);
        background: linear-gradient(45deg, var(--accent), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .card-desc {
        color: var(--text-sub);
        font-size: 0.9rem;
        line-height: 1.5;
        max-width: 250px;
      }

      /* 发光边框 */
      .nav-card::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent));
        border-radius: 18px;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s ease;
        animation: glowRotate 3s linear infinite;
      }

      .nav-card:hover::before {
        opacity: 1;
      }

      /* 动画定义 */
      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glowRotate {
        0%,
        100% {
          filter: hue-rotate(0deg);
        }
        50% {
          filter: hue-rotate(180deg);
        }
      }

      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 备用粒子动画 */
      .fallback-particles {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        background: var(--primary);
        border-radius: 50%;
        animation: float linear infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(-100px) translateX(20px);
          opacity: 0;
        }
      }

      /* 响应式设计 */
      @media (min-width: 1400px) {
        .nav-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .container {
          padding: 3rem;
        }
      }

      @media (min-width: 1024px) and (max-width: 1399px) {
        .nav-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (min-width: 768px) and (max-width: 1023px) {
        .nav-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .container {
          padding: 1.5rem;
        }
        .header h1 {
          font-size: 2.8rem;
        }
      }

      @media (max-width: 767px) {
        .nav-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }
        .container {
          padding: 1rem;
        }
        .header {
          margin: 1rem 0 2rem;
        }
        .header h1 {
          font-size: 2rem;
          letter-spacing: 1px;
        }
        .nav-card {
          padding: 1.5rem;
          min-height: 160px;
        }
        .card-icon {
          font-size: 2.5rem;
          margin-bottom: 1rem;
        }
        .card-title {
          font-size: 1.3rem;
        }
        .card-desc {
          font-size: 0.85rem;
          max-width: 100%;
        }
        body {
          font-size: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        ::before,
        ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <script src="./js/particles.min.js"></script>

    <script>
      (function () {
        "use strict";

        const MOBILE_BP = 768;
        const RESIZE_DEBOUNCE = 300;
        let isActive = false;
        let resizeTimer = null;

        // 粒子系统管理
        function destroySystem() {
          try {
            if (window.pJSDom && window.pJSDom[0] && window.pJSDom[0].pJS) {
              window.pJSDom[0].pJS.fn.vendors.destroypJS();
              window.pJSDom = [];
            }
          } catch (e) {
            /* ignore */
          }

          var fallback = document.getElementById("fallback-particles");
          if (fallback) fallback.innerHTML = "";

          isActive = false;
        }

        function initParticles() {
          try {
            var mobile = window.innerWidth <= MOBILE_BP;
            particlesJS("particles-js", {
              particles: {
                number: { value: mobile ? 40 : 80, density: { enable: true, value_area: mobile ? 600 : 800 } },
                color: { value: "#00f3ff" },
                shape: { type: "circle" },
                opacity: { value: 0.5, random: true },
                size: { value: mobile ? 2 : 3, random: true },
                line_linked: {
                  enable: true,
                  distance: mobile ? 100 : 150,
                  color: "#00f3ff",
                  opacity: mobile ? 0.2 : 0.3,
                  width: 1,
                },
                move: {
                  enable: true,
                  speed: mobile ? 1 : 2,
                  direction: "none",
                  random: true,
                  straight: false,
                  out_mode: "out",
                  bounce: false,
                },
              },
              interactivity: {
                detect_on: "canvas",
                events: {
                  onhover: { enable: true, mode: "repulse" },
                  onclick: { enable: true, mode: "push" },
                  resize: false,
                },
                modes: {
                  repulse: { distance: mobile ? 80 : 100, duration: 0.4 },
                  push: { particles_nb: mobile ? 2 : 4 },
                },
              },
              retina_detect: true,
            });
          } catch (e) {
            initFallback();
          }
        }

        function initFallback() {
          var container = document.getElementById("fallback-particles");
          if (!container) return;

          container.innerHTML = "";
          var count = window.innerWidth <= MOBILE_BP ? 20 : 40;

          var frag = document.createDocumentFragment();
          for (var i = 0; i < count; i++) {
            var el = document.createElement("div");
            el.className = "particle";
            var size = Math.random() * 4 + 1;
            el.style.cssText =
              "width:" +
              size +
              "px;" +
              "height:" +
              size +
              "px;" +
              "left:" +
              Math.random() * 100 +
              "%;" +
              "animation-duration:" +
              (Math.random() * 10 + 10) +
              "s;" +
              "animation-delay:" +
              Math.random() * 5 +
              "s;" +
              "opacity:" +
              (Math.random() * 0.5 + 0.2);
            frag.appendChild(el);
          }
          container.appendChild(frag);
        }

        function initSystem() {
          destroySystem();
          if (typeof particlesJS !== "undefined") {
            initParticles();
          } else {
            initFallback();
          }
          isActive = true;
        }

        // 防抖 resize
        function handleResize() {
          if (resizeTimer) clearTimeout(resizeTimer);
          resizeTimer = setTimeout(initSystem, RESIZE_DEBOUNCE);
        }

        // 初始化
        document.addEventListener("DOMContentLoaded", function () {
          setTimeout(initSystem, 100);
        });
        window.addEventListener("resize", handleResize);

        // 链接处理 — 记账系统根据设备跳转不同地址
        (function () {
          var isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
          var link = document.querySelector(".account-link");
          if (link) link.href = isMobile ? "https://m.keep-silent.com" : "https://admin.keep-silent.com";
        })();

        // 涟漪点击效果
        document.querySelectorAll(".nav-card").forEach(function (card) {
          card.addEventListener("click", function (e) {
            e.preventDefault();
            var self = this;
            var ripple = document.createElement("span");
            var rect = self.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var x = e.clientX - rect.left - size / 2;
            var y = e.clientY - rect.top - size / 2;

            ripple.style.cssText =
              "position:absolute;" +
              "width:" +
              size +
              "px;" +
              "height:" +
              size +
              "px;" +
              "left:" +
              x +
              "px;" +
              "top:" +
              y +
              "px;" +
              "background:radial-gradient(circle,rgba(0,243,255,0.6) 0%,transparent 70%);" +
              "border-radius:50%;" +
              "transform:scale(0);" +
              "animation:ripple 0.6s linear;" +
              "pointer-events:none;" +
              "z-index:10";

            self.appendChild(ripple);
            setTimeout(function () {
              ripple.remove();
              window.open(self.href, self.target || "_self");
            }, 300);
          });
        });

        // 错误恢复
        window.addEventListener("error", function (e) {
          if (e.error && e.error.message && e.error.message.indexOf("particles") > -1) {
            setTimeout(function () {
              if (!isActive) initSystem();
            }, 1000);
          }
        });
      })();
    </script>
